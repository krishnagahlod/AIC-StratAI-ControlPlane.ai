name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        # The tests exercise pure functions and never call a model, but importing the app
        # validates settings, and GEMINI_API_KEY has no default by design — a deployment
        # without one should fail loudly rather than start half-configured. A placeholder
        # satisfies the schema without granting CI any credential.
        env:
          GEMINI_API_KEY: ci-placeholder-not-a-real-key
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The production build is the real check: it type-checks the whole app and fails on
      # any error the dev server would have tolerated.
      - name: Build
        working-directory: frontend
        run: npm run build
